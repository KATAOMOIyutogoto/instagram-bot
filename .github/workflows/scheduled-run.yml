name: Instagram Bot Scheduled Run

on:
  schedule:
    # 1時間ごとに実行（UTC時間）
    # 日本時間（JST = UTC+9）で実行したい場合は、-9時間した時刻を指定
    # 例: 日本時間の毎時0分に実行したい場合 → cron: '0 * * * *' を '0 15 * * *' に変更（UTC 15:00 = JST 00:00）
    - cron: '0 * * * *'  # 毎時0分に実行
  workflow_dispatch:  # 手動実行も可能

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # タイムアウト: 60分
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create necessary directories
      run: |
        mkdir -p data logs config
    
    - name: Setup configuration
      env:
        INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
        INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
      run: |
        # config.jsonが存在しない場合は、環境変数から作成
        # 実際の設定は手動でconfig/config.jsonを作成してください
        echo "設定ファイルを確認してください"
    
    - name: Run Instagram Bot (once)
      env:
        PYTHONUNBUFFERED: 1
      run: |
        python -m src.scheduler --once --lock-file data/scheduler.lock
    
    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: logs
        path: |
          logs/
          data/

